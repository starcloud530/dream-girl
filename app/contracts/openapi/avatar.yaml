openapi: 3.1.0
info:
  title: Dream Girl Avatar Gateway
  version: 0.1.0
  description: >
    FlashHead talking-head gateway. App talks to this HTTP contract only
    (no direct Python imports of vendor/flashhead).
servers:
  - url: http://127.0.0.1:6008
    description: FlashHead Gateway (GPU box)
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        "200":
          description: Service health (includes face_preroll_ms, av_mode, etc.)
  /v1/avatar/session:
    post:
      operationId: createAvatarSession
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                avatar_id:
                  type: string
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required: [session_id]
                properties:
                  session_id:
                    type: string
  /v1/avatar/{session_id}/audio:
    post:
      operationId: pushPcm
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: end
          in: query
          schema:
            type: integer
            enum: [0, 1]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: PCM accepted
  /v1/avatar/{session_id}/interrupt:
    post:
      operationId: interruptAvatar
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Turn reset / interrupt
  /v1/avatar/{session_id}/av/sse:
    get:
      operationId: avSse
      summary: SSE stream of av_mp4 metadata (chunk, url, duration_ms, format)
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
  /v1/avatar/{session_id}/mp4/{chunk}:
    get:
      operationId: getMp4Chunk
      summary: Fetch fMP4/MP4 segment bytes for MSE
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: chunk
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: media bytes
          content:
            video/mp4:
              schema:
                type: string
                format: binary
