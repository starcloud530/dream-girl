# T0 · Pro + Sage + 464²@20，无 compile（基线 RTP）
tier: t0_baseline

paths:
  models_root: "${MODELS_ROOT}"
  cyberverse_models_dir: "${CYBERVERSE_MODELS_DIR}"
  sample_image: "${CYBER_GF_DATA_ROOT}/demo/assets/character/xiaoya-v1-top1x1.jpg"
  sample_audio: "${CYBER_GF_DATA_ROOT}/demo/tmp/frame_capture/tone_20260727_142329.wav"

runtime:
  model_type: pro
  checkpoint_dir: "${MODELS_ROOT}/SoulX-FlashHead-1_3B"
  wav2vec_dir: "${MODELS_ROOT}/wav2vec2-base-960h"
  seed: 9999
  use_face_crop: false
  compile_model: false
  compile_vae: false
  world_size: 1
  letterbox_input: false
  display_size: 928

infer_params:
  frame_num: 33
  motion_frames_latent_num: 2
  tgt_fps: 20
  sample_rate: 16000
  sample_shift: 5
  color_correction_strength: 1.0
  cached_audio_duration: 8
  num_heads: 12
  height: 464
  width: 464

benchmark:
  warmup_runs: 1
  runs: 3
  output_dir: results/v1
