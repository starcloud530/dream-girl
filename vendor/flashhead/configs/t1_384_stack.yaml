# T1 · 上半身 384² + 前端 face-stack（2:3 底静图 + 顶 1:1 动）
# 相对 paste_back 紧脸：头发随上半身一起动，避免「脸动发不动」
tier: t1_384_stack

paths:
  models_root: "${MODELS_ROOT}"
  cyberverse_models_dir: "${CYBERVERSE_MODELS_DIR}"
  sample_image: "${CYBER_GF_DATA_ROOT}/demo/assets/character/xiaoya-v1-sit-top1x1.jpg"
  sample_audio: "${CYBER_GF_DATA_ROOT}/demo/tmp/frame_capture/tone_20260727_142329.wav"

runtime:
  model_type: pro
  checkpoint_dir: "${MODELS_ROOT}/SoulX-FlashHead-1_3B"
  wav2vec_dir: "${MODELS_ROOT}/wav2vec2-base-960h"
  seed: 9999
  use_face_crop: false
  compile_model: true
  compile_vae: true
  world_size: 1
  letterbox_input: false
  # 双线性放大到 512 再编码（CSS 叠在 2:3 顶部）
  display_size: 512

upscale:
  enabled: false
  model: "${AUTODL_FS_MODELS}/upscale_models/RealESRGAN_x2.pth"

infer_params:
  frame_num: 33
  motion_frames_latent_num: 2
  tgt_fps: 20
  sample_rate: 16000
  sample_shift: 5
  color_correction_strength: 1.0
  cached_audio_duration: 8
  num_heads: 12
  height: 384
  width: 384

# 关闭贴回：由前端 face-stack 叠层（layout=frontend_stack）
composite:
  enabled: false

benchmark:
  warmup_runs: 2
  runs: 3
  output_dir: results/v1
