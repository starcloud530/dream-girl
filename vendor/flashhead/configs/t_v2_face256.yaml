# V2 · FlashHead 1:1 头顶区 + 前端 2:3 底图叠层（后端不贴回）
# 从 2:3 立绘顶部截 1:1 → FlashHead 生成；前端上面动、下面静，整体仍是 2:3
tier: t_v2_face256

paths:
  models_root: "${MODELS_ROOT}"
  cyberverse_models_dir: "${CYBERVERSE_MODELS_DIR}"
  # 2:3 立绘顶部 1:1（与 demo/assets/character/xiaoya-v1-top1x1.jpg 同源）
  sample_image: "assets/preset_clips/xiaoya_top1x1.jpg"
  sample_audio: "${CYBER_GF_DATA_ROOT}/demo/tmp/frame_capture/tone_20260727_142329.wav"

runtime:
  model_type: pro
  checkpoint_dir: "${MODELS_ROOT}/SoulX-FlashHead-1_3B"
  wav2vec_dir: "${MODELS_ROOT}/wav2vec2-base-960h"
  seed: 9999
  use_face_crop: false
  compile_model: true
  compile_vae: true
  world_size: 1
  letterbox_input: true
  # 前端叠在 2:3 顶部方区，略放大更清晰
  display_size: 512

infer_params:
  frame_num: 33
  motion_frames_latent_num: 2
  tgt_fps: 20
  sample_rate: 16000
  sample_shift: 5
  color_correction_strength: 1.0
  cached_audio_duration: 8
  num_heads: 12
  height: 256
  width: 256

composite:
  # 后端贴回关掉；身体用前端静态 2:3 立绘
  enabled: false
  preset_manifest: "assets/preset_clips/manifest.json"
  preset_video: "assets/preset_clips/xiaoya_idle_512x768.mp4"
  boxes_jsonl: "assets/preset_clips/xiaoya_idle_512x768.boxes.jsonl"
  face_ref: "assets/preset_clips/xiaoya_top1x1.jpg"
  random_clip: true
  canvas_width: 512
  canvas_height: 768
  feather_px: 14

benchmark:
  warmup_runs: 2
  runs: 3
  output_dir: results/v2
